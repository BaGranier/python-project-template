[project]
name = "python-project-template"
version = "0.1.0"
description = "Cookiecutter/Cruft generator for modern uv Python projects"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = ["cookiecutter>=2.6,<3", "cruft>=2.6,<3", "pytest>=8,<10", "pyyaml>=6,<7", "jupytext>=1.16,<2", "jinja2>=3.1,<4"]
lint = ["ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6"]
dev = [{include-group = "test"}, {include-group = "lint"}]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["{{cookiecutter.project_slug}}", "hooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests", "scripts"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
