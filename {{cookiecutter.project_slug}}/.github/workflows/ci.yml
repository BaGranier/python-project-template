name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: make check
      - run: make build
{% if cookiecutter.enable_docs == 'yes' %}
      - run: make docs-build
{% endif %}
