[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = {{ cookiecutter.description | tojson }}
authors = [{name = {{ cookiecutter.author_name | tojson }}}]
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
dependencies = []

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "{{ cookiecutter.package_name }}"

[dependency-groups]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
lint = ["ruff>=0.11,<1", "mypy>=1.15,<2"]
{% if cookiecutter.enable_notebooks == 'yes' %}
notebook = ["jupyterlab>=4,<5", "jupytext>=1.16,<2"]
{% endif %}
{% if cookiecutter.enable_docs == 'yes' %}
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]
{% endif %}
dev = [
    {include-group = "test"},
    {include-group = "lint"},
{% if cookiecutter.enable_notebooks == 'yes' %}
    {include-group = "notebook"},
{% endif %}
{% if cookiecutter.enable_docs == 'yes' %}
    {include-group = "docs"},
{% endif %}
    "pre-commit>=4,<5",
]

[tool.ruff]
target-version = "py{{ cookiecutter.python_version.split('.')[0:2] | join('') }}"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "{{ cookiecutter.python_version.split('.')[0:2] | join('.') }}"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["{{ cookiecutter.package_name }}"]
