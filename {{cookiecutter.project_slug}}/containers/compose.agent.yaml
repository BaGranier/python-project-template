name: {{ cookiecutter.project_slug }}-agent
services:
  agent:
    image: localhost/{{ cookiecutter.project_slug }}-agent:template-v2-{{ cookiecutter.coding_agent }}
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: agent
    user: "1000:1000"
    userns_mode: "keep-id:uid=1000,gid=1000"
    working_dir: /workspace
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    volumes:
      - ${AGENT_WORKSPACE:?run make agent-start}:/workspace:Z
      - agent-venv:/opt/venv
      - agent-cache:/home/agent/.cache/uv
{% if cookiecutter.coding_agent in ['codex', 'both'] %}
      - agent-codex-home:/home/agent/.codex
{% endif %}
{% if cookiecutter.coding_agent in ['claude', 'both'] %}
      - agent-claude-home:/home/agent/.claude
{% endif %}
{% if cookiecutter.coding_agent == 'custom' %}
      - agent-tools:/home/agent/.local
      - agent-config:/home/agent/.config
{% endif %}
    ports:
      - "127.0.0.1:${AGENT_APP_PORT:-18000}:8000"
{% if cookiecutter.enable_notebooks == 'yes' %}
      - "127.0.0.1:${AGENT_JUPYTER_PORT:-18888}:8888"
{% endif %}
{% if cookiecutter.enable_docs == 'yes' %}
      - "127.0.0.1:${AGENT_DOCS_PORT:-18001}:8001"
{% endif %}
    stdin_open: true
    tty: true
volumes:
  agent-venv:
  agent-cache:
{% if cookiecutter.coding_agent in ['codex', 'both'] %}
  agent-codex-home:
    name: {{ cookiecutter.project_slug }}-agent-codex-home
{% endif %}
{% if cookiecutter.coding_agent in ['claude', 'both'] %}
  agent-claude-home:
    name: {{ cookiecutter.project_slug }}-agent-claude-home
{% endif %}
{% if cookiecutter.coding_agent == 'custom' %}
  agent-tools:
    name: {{ cookiecutter.project_slug }}-agent-tools
  agent-config:
    name: {{ cookiecutter.project_slug }}-agent-config
{% endif %}
