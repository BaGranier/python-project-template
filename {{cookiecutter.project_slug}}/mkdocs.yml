site_name: {{ cookiecutter.project_name | tojson }}
theme:
  name: material
strict: true
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Development: development.md
  - Architecture: architecture.md
  - Testing: testing.md
{% if cookiecutter.enable_notebooks == 'yes' %}
  - Notebooks: notebooks.md
{% endif %}
{% if cookiecutter.dev_container_runtime != 'none' or cookiecutter.coding_agent != 'none' %}
  - Containers: containers.md
{% endif %}
{% if cookiecutter.dev_container_runtime == 'podman' or cookiecutter.coding_agent != 'none' %}
  - Podman setup: podman.md
{% endif %}
{% if cookiecutter.coding_agent != 'none' %}
  - Coding agent: agent.md
  - Agent security: agent-security.md
{% endif %}
  - Decisions: adr/README.md
