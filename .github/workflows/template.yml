name: Template validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: make check
